name: Deploy Anime Voice Studio backend

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anime-voice-modal-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate files and credentials
        shell: bash
        run: |
          python -m py_compile modal_app.py backend.py
          if [[ -z "$MODAL_TOKEN_ID" || -z "$MODAL_TOKEN_SECRET" ]]; then
            echo "Missing MODAL_TOKEN_ID or MODAL_TOKEN_SECRET in GitHub Actions secrets."
            exit 1
          fi
      - name: Install Modal CLI
        run: python -m pip install --upgrade 'modal>=1.0,<2'
      - name: Deploy voice engine to Modal
        run: modal deploy modal_app.py
